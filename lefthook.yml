# LEFTHOOK - Configuration
# Referência: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # BRANCH PROTECTION
    # --------------------------------------------------------------------------
    check-branch:
      run: |
        branch=$(git branch --show-current)
        if [ "$branch" = "main" ] || [ "$branch" = "dev" ]; then
          echo "❌ ERROR: Direct commits to the '$branch' branch are not allowed!"
          echo "Please create a new branch or use an existing feature branch."
          exit 1
        fi

    # --------------------------------------------------------------------------
    # MOBILE (Flutter)
    # --------------------------------------------------------------------------
    mobile-lint:
      root: apps/mobile # Define o diretório de execução
      glob: "**/*.dart" # Só roda se arquivos .dart mudarem
      run: dart analyze .

    mobile-tests:
      root: apps/mobile
      glob: "**/*.dart"
      run: flutter test # Roda Unit e Widget tests

    backend-tests:
      root: apps/backend
      glob: "**/*.ts"
      run: npm run test

pre-push:
  parallel: true
  commands:
    backend-e2e:
      root: apps/backend
      glob: "**/*.ts"
      run: npm run test:e2e
